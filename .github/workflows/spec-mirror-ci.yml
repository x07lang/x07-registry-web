name: Spec Mirror CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry-web
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout x07
        uses: actions/checkout@v4
        with:
          repository: x07lang/x07
          path: _deps/x07

      - name: Checkout x07-wasm-backend
        uses: actions/checkout@v4
        with:
          repository: x07lang/x07-wasm-backend
          path: _deps/x07-wasm-backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Spec mirror drift
        run: bash scripts/check_generated_spec_mirror.sh

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
